<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THD OMSID Final URL Resolver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #f97316; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden-tool { display: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 text-gray-800">

    <div id="loginScreen" class="flex items-center justify-center min-h-[80vh]">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-6">
                <div class="bg-orange-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-orange-600">THD</div>
                <h2 class="text-2xl font-bold">Team Access</h2>
                <p class="text-gray-500 text-sm">Enter password to resolve urls</p>
            </div>
            <input type="password" id="pwordInput" class="w-full p-3 border border-gray-300 rounded-lg mb-4 outline-none focus:ring-2 focus:ring-orange-500" placeholder="Password">
            <button onclick="checkPassword()" class="w-full bg-orange-600 text-white font-bold py-3 rounded-lg hover:bg-orange-700 transition">Unlock</button>
            <p id="loginError" class="text-red-500 text-xs mt-3 hidden text-center italic">Wrong password!</p>
        </div>
    </div>

    <div id="mainTool" class="max-w-5xl mx-auto hidden-tool">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-orange-600 mb-2">OMSID Resolver</h1>
            <p class="text-gray-500 italic">Bypassing blocks for better results</p>
        </header>

        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <label class="block text-sm font-semibold mb-2 uppercase tracking-wider text-gray-600">Paste OMSIDs</label>
            <textarea id="omsidInput" rows="6" class="w-full p-4 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none" placeholder="325532197..."></textarea>
            <button onclick="resolveURLs()" class="mt-4 w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition shadow-lg">
                Resolve Final URLs
            </button>
        </div>

        <div id="loading" class="hidden flex flex-col items-center mb-8">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
            <p id="loadingText" class="text-orange-600 font-medium animate-pulse text-center">Crunching data...</p>
        </div>

        <div id="outputContainer" class="hidden bg-white rounded-xl shadow-md overflow-hidden border">
            <div class="flex flex-wrap gap-2 justify-between items-center p-4 bg-gray-50 border-b">
                <h2 class="font-bold text-lg">Results</h2>
                <div class="flex gap-2">
                    <button onclick="copyTable()" class="text-sm bg-gray-800 text-white px-4 py-2 rounded hover:bg-black transition">Copy Table</button>
                    <button onclick="downloadCSV()" class="text-sm bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition font-bold">Download CSV</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table id="resultsTable" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b">
                            <th class="p-4 font-semibold text-gray-600">OMSID</th>
                            <th class="p-4 font-semibold text-gray-600">Brand</th>
                            <th class="p-4 font-semibold text-gray-600">Final URL</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const THE_PASSWORD = "MACKOAM"; // Update as needed
        let resolvedData = [];

        function checkPassword() {
            if (document.getElementById('pwordInput').value === THE_PASSWORD) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainTool').classList.remove('hidden-tool');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        async function resolveURLs() {
            const input = document.getElementById('omsidInput').value;
            const omsids = input.split(/\s+/).filter(id => id.length > 0);
            const resultsBody = document.getElementById('resultsBody');
            const outputContainer = document.getElementById('outputContainer');
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loadingText');

            resultsBody.innerHTML = '';
            resolvedData = [];
            outputContainer.classList.add('hidden');
            loading.classList.remove('hidden');

            for (let i = 0; i < omsids.length; i++) {
                const id = omsids[i];
                loadingText.innerText = `Resolving ${i + 1} of ${omsids.length}...`;
                
                // Using a fallback strategy with a more resilient proxy
                const finalUrl = await fetchWithRetry(id);
                const brand = finalUrl.includes("Error") ? "Error" : "Samsung";

                appendRow(id, brand, finalUrl);
                resolvedData.push({ omsid: id, brand, url: finalUrl });
                
                // Add a small delay between requests to avoid triggering bot protection
                await new Promise(r => setTimeout(r, 600));
            }

            loading.classList.add('hidden');
            outputContainer.classList.remove('hidden');
        }

        async function fetchWithRetry(id) {
            // Using a more reliable "CORS Proxy" bridge
            const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent('https://www.homedepot.com/p/' + id)}`;
            
            try {
                const res = await fetch(proxyUrl);
                const html = await res.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const title = doc.querySelector('title')?.innerText.split(' - ')[0] || "product";
                
                if (title.toLowerCase().includes("access denied")) return "Error: Connection Blocked";

                const slug = title.replace(/[^a-z0-9]/gi, '-').replace(/-+/g, '-').toLowerCase();
                return `https://www.homedepot.com/p/${slug}/${id}`;
            } catch (e) {
                return "Error: Network Issue";
            }
        }

        function appendRow(id, brand, url) {
            const isError = url.includes("Error");
            const row = `<tr>
                <td class="p-4 font-mono text-sm">${id}</td>
                <td class="p-4 ${isError ? 'text-red-500 font-bold' : ''}">${brand}</td>
                <td class="p-4 text-blue-600 break-all text-xs font-mono">
                    ${isError ? url : `<a href="${url}" target="_blank">${url}</a>`}
                </td>
            </tr>`;
            resultsBody.innerHTML += row;
        }

        function downloadCSV() {
            let csv = "OMSID,Brand,Final URL\n";
            resolvedData.forEach(r => { csv += `${r.omsid},${r.brand},"${r.url}"\n`; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'page_feed_results.csv');
            a.click();
        }

        function copyTable() {
            const range = document.createRange();
            range.selectNode(document.getElementById('resultsTable'));
            window.getSelection().addRange(range);
            document.execCommand('copy');
            alert("Copied!");
        }
    </script>
</body>
</html>
